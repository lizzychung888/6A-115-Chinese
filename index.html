<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小六年級 國語 1-6 課 全方位特訓大樂園</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #FDF4F5 0%, #F3F8FF 50%, #F5FBF7 100%);
      min-height: 100vh;
    }
    .macaron-shadow {
      box-shadow: 0 8px 24px -4px rgba(149, 157, 165, 0.15);
    }
    .card-tap {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-tap:hover {
      transform: translateY(-2px);
    }
    .card-tap:active {
      transform: scale(0.97);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-700 antialiased selection:bg-rose-200">

  <!-- 頂部大標題 -->
  <header class="pt-8 pb-4 text-center px-4">
    <div class="inline-flex items-center gap-2 bg-rose-50 text-rose-500 font-extrabold px-5 py-1.5 rounded-full text-sm border border-rose-200 mb-3 shadow-sm">
      <span>🎓</span> 國小六年級 國語 1-6 課特訓大樂園
    </div>
    <h1 class="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight">國語考前全方位互動特訓網</h1>
    <p class="text-slate-500 font-bold text-sm mt-2">詞語消消樂 ✕ 詞語情境測驗 ✕ 短語結構 ✕ 成語挑戰 ✕ 修辭字詞擂台</p>

    <!-- 第一層主導航列 -->
    <nav class="flex flex-wrap justify-center gap-2 sm:gap-3 mt-6 max-w-4xl mx-auto px-2">
      <button onclick="switchMainTab('match')" id="mainTab-match" class="px-5 py-2.5 rounded-2xl font-bold transition-all shadow-sm bg-rose-400 text-white">
        🌸 詞語配對消消樂
      </button>
      <button onclick="switchMainTab('vocabQuiz')" id="mainTab-vocabQuiz" class="px-5 py-2.5 rounded-2xl font-bold transition-all shadow-sm text-slate-600 hover:bg-amber-100 bg-white">
        📝 詞語選填測驗
      </button>
      <button onclick="switchMainTab('grammar')" id="mainTab-grammar" class="px-5 py-2.5 rounded-2xl font-bold transition-all shadow-sm text-slate-600 hover:bg-violet-100 bg-white">
        🧩 語法特訓大擂台
      </button>
      <button onclick="switchMainTab('dict')" id="mainTab-dict" class="px-5 py-2.5 rounded-2xl font-bold transition-all shadow-sm text-slate-600 hover:bg-sky-100 bg-white">
        📖 成語百寶箱字典
      </button>
      <button onclick="switchMainTab('vocabManual')" id="mainTab-vocabManual" class="px-5 py-2.5 rounded-2xl font-bold transition-all shadow-sm text-slate-600 hover:bg-emerald-100 bg-white">
        📚 課文語詞全手冊
      </button>
    </nav>
  </header>

  <main class="max-w-5xl mx-auto p-4 sm:p-6 mb-16">

    <!-- ================= 1. 詞語配對消消樂面板 ================= -->
    <section id="panel-match" class="space-y-6">
      <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 macaron-shadow border-2 border-rose-100 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <span class="w-3 h-8 bg-rose-400 rounded-full inline-block"></span>
          <h2 id="match-lesson-title" class="text-2xl font-extrabold text-slate-800">第 1 課《遇見自己》詞語連連看</h2>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs bg-rose-50 text-rose-600 px-3 py-1.5 rounded-xl font-bold border border-rose-200">
            已消除：<span id="match-cleared-count" class="font-black text-rose-700">0</span> / 10 組
          </span>
          <button onclick="initMatchGame(currentMatchLesson)" class="px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs transition-all">
            🔄 重整本課
          </button>
        </div>
      </div>

      <!-- 課次子選單 -->
      <div class="flex gap-2 overflow-x-auto pb-2 hide-scrollbar">
        <button onclick="changeMatchLesson(1)" id="btn-mlesson-1" class="px-4 py-2 rounded-2xl text-sm font-black transition-all bg-rose-400 text-white shadow-sm shrink-0">第 1 課</button>
        <button onclick="changeMatchLesson(2)" id="btn-mlesson-2" class="px-4 py-2 rounded-2xl text-sm font-black transition-all bg-white text-slate-600 hover:bg-rose-50 border border-slate-200 shrink-0">第 2 課</button>
        <button onclick="changeMatchLesson(3)" id="btn-mlesson-3" class="px-4 py-2 rounded-2xl text-sm font-black transition-all bg-white text-slate-600 hover:bg-rose-50 border border-slate-200 shrink-0">第 3 課</button>
        <button onclick="changeMatchLesson(4)" id="btn-mlesson-4" class="px-4 py-2 rounded-2xl text-sm font-black transition-all bg-white text-slate-600 hover:bg-rose-50 border border-slate-200 shrink-0">第 4 課</button>
        <button onclick="changeMatchLesson(5)" id="btn-mlesson-5" class="px-4 py-2 rounded-2xl text-sm font-black transition-all bg-white text-slate-600 hover:bg-rose-50 border border-slate-200 shrink-0">第 5 課</button>
        <button onclick="changeMatchLesson(6)" id="btn-mlesson-6" class="px-4 py-2 rounded-2xl text-sm font-black transition-all bg-white text-slate-600 hover:bg-rose-50 border border-slate-200 shrink-0">第 6 課</button>
      </div>

      <!-- 配對遊戲主舞台 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-3">
          <div class="text-sm font-black text-rose-500 flex items-center gap-1.5 px-2">
            <span>🏷️</span> 課文生字詞語卡（點選）
          </div>
          <div id="match-words-container" class="space-y-2.5"></div>
        </div>
        <div class="space-y-3">
          <div class="text-sm font-black text-sky-500 flex items-center gap-1.5 px-2">
            <span>💡</span> 語詞解釋卡（點選對應配對）
          </div>
          <div id="match-meanings-container" class="space-y-2.5"></div>
        </div>
      </div>
    </section>

    <!-- ================= 2. 詞語選填測驗面板 ================= -->
    <section id="panel-vocabQuiz" class="hidden space-y-6">
      <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 macaron-shadow border-2 border-amber-100 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <span class="w-3 h-8 bg-amber-400 rounded-full inline-block"></span>
          <h2 id="vq-title" class="text-2xl font-extrabold text-slate-800">第 1 課 詞語情境選填測驗</h2>
        </div>
        <div class="flex items-center gap-4">
          <div class="bg-amber-50 px-4 py-2 rounded-2xl border border-amber-200 flex items-center gap-2">
            <span class="text-amber-600 font-bold text-sm">測驗進度：</span>
            <span id="vq-progress" class="font-black text-amber-700">1 / 12</span>
          </div>
          <div class="bg-emerald-50 px-4 py-2 rounded-2xl border border-emerald-200 flex items-center gap-2">
            <span class="text-emerald-600 font-bold text-sm">得分：</span>
            <span id="vq-score" class="font-black text-emerald-700 text-lg">0</span>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-3xl p-8 macaron-shadow border border-slate-100 space-y-8">
        <div class="bg-gradient-to-r from-amber-50 to-orange-50 p-6 rounded-2xl border border-amber-200/80">
          <p class="text-slate-500 font-bold text-sm mb-2">📌 請閱讀情境句子，選出最適合填入括號中的詞語：</p>
          <p id="vq-sentence" class="text-2xl font-extrabold text-slate-800 leading-relaxed tracking-wide"></p>
        </div>

        <div id="vq-options" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        <div id="vq-feedback" class="hidden p-5 rounded-2xl border transition-all text-base font-bold leading-relaxed"></div>
      </div>
    </section>

    <!-- ================= 3. 語法特訓大擂台面板 ================= -->
    <section id="panel-grammar" class="hidden space-y-6">
      <!-- 語法第二層子分頁導航 -->
      <div class="flex flex-wrap gap-2 sm:gap-3 p-1.5 bg-white/80 backdrop-blur rounded-2xl border border-slate-200">
        <button onclick="switchGrammarSubTab('phrase')" id="gsub-phrase" class="px-4 py-2 rounded-xl font-bold text-sm transition-all bg-violet-500 text-white shadow-sm">
          🧩 短語結構拼圖
        </button>
        <button onclick="switchGrammarSubTab('idiomGame')" id="gsub-idiomGame" class="px-4 py-2 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-slate-100">
          📜 成語情境挑戰
        </button>
        <button onclick="switchGrammarSubTab('rhetoric')" id="gsub-rhetoric" class="px-4 py-2 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-slate-100">
          🎭 修辭文法擂台
        </button>
        <button onclick="switchGrammarSubTab('wordCheck')" id="gsub-wordCheck" class="px-4 py-2 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-slate-100">
          🔍 字詞火眼金睛
        </button>
      </div>

      <!-- 3-1 短語結構拼圖 -->
      <div id="subpanel-phrase" class="space-y-6">
        <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 macaron-shadow border-2 border-violet-100 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <span id="phrase-badge" class="px-3.5 py-1.5 rounded-xl bg-violet-100 text-violet-700 font-black text-sm">核心句型</span>
              <h3 id="phrase-type-title" class="text-xl sm:text-2xl font-extrabold text-slate-800">在樹梢上找到風的淘氣</h3>
            </div>
            <div class="flex items-center gap-4">
              <div class="flex items-center gap-1.5 bg-violet-50 px-3.5 py-1.5 rounded-xl border border-violet-200 text-xs font-bold text-violet-700">
                <span>進度：</span>
                <span id="phrase-stars">⭐⭐⭐</span>
                <span id="phrase-subq-label" class="ml-1">第 1/3 題</span>
              </div>
              <div class="text-xs bg-amber-50 text-amber-700 px-3.5 py-1.5 rounded-xl font-black border border-amber-200">
                得分：<span id="phrase-score">0</span>
              </div>
              <button onclick="resetCurrentPhraseQuestion()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold">
                🔄 重練
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 border-t border-slate-100 text-sm">
            <div class="bg-violet-50/60 p-3.5 rounded-2xl border border-violet-100">
              <span class="font-extrabold
